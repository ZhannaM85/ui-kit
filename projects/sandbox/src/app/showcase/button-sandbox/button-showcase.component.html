<div class="showcase">
  <h1 class="showcase-title">Button</h1>
  <p class="showcase-desc">Variants and sizes of the button component.</p>

  <section class="showcase-section">
    <h3>Usage</h3>
    <div class="usage-block">
      <div class="usage-copy-wrap">
        <span *ngIf="copied" class="usage-copied-label">Copied!</span>
        <button type="button" class="usage-copy" [class.usage-copy--success]="copied" (buttonClicked)="copyUsageCode()" [title]="copied ? 'Copied!' : 'Copy code'">
          <svg *ngIf="copied" class="usage-copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <svg *ngIf="!copied" class="usage-copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <pre class="usage-example"><code>&lt;kit-button
  [label]="'My button label'"
  [variant]="'primary'"
  [disabled]="false"
  [type]="'submit'"
  [size]="'large'"
  (buttonClicked)="buttonClicked($event)"
&gt;&lt;/kit-button&gt;</code></pre>
    </div>
  </section>

  <section class="showcase-section">
    <h3>Variants</h3>
    <div class="row">
      <kit-button label="Primary" variant="primary" (buttonClicked)="onClick($event)"></kit-button>
      <kit-button label="Secondary" variant="secondary" (buttonClicked)="onClick($event)"></kit-button>
      <kit-button label="Danger" variant="danger" (buttonClicked)="onClick($event)"></kit-button>
    </div>
  </section>

  <section class="showcase-section">
    <h3>Sizes</h3>
    <div class="row">
      <kit-button label="Small" size="small" (buttonClicked)="onClick($event)"></kit-button>
      <kit-button label="Medium" size="medium" (buttonClicked)="onClick($event)"></kit-button>
      <kit-button label="Large" size="large" (buttonClicked)="onClick($event)"></kit-button>
    </div>
  </section>

  <section class="showcase-section">
    <h3>States</h3>
    <div class="row">
      <kit-button label="Disabled" [disabled]="true"></kit-button>
      <kit-button label="Submit" type="submit" (buttonClicked)="onClick($event)"></kit-button>
    </div>
  </section>
</div>
