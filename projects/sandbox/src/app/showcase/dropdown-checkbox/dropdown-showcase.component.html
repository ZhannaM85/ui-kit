<div class="showcase">
    <h1 class="showcase-title">Dropdown</h1>
    <p class="showcase-desc">Select component with customizable options.</p>

    <section class="showcase-section">
        <h3>Usage</h3>
        <div class="usage-block">
            <div class="usage-copy-wrap">
                <span *ngIf="copied" class="usage-copied-label">Copied!</span>
                <button type="button" class="usage-copy" [class.usage-copy--success]="copied" (click)="copyUsageCode()" [title]="copied ? 'Copied!' : 'Copy code'">
                    <kit-icon-check *ngIf="copied" class="usage-copy-icon" [size]="16"></kit-icon-check>
                    <kit-icon-copy *ngIf="!copied" class="usage-copy-icon" [size]="16"></kit-icon-copy>
                </button>
            </div>
            <pre class="usage-example"><code>&lt;kit-dropdown
  [options]="options"
  placeholder="Choose one"
  [selectedValue]="selectedValue"
  (selectionChange)="onSelectionChange($event)"
&gt;&lt;/kit-dropdown&gt;</code>
            </pre>
        </div>
    </section>

    <section class="showcase-section">
        <h3>Default</h3>
        <kit-dropdown
            [options]="options"
            placeholder="Choose one"
            [selectedValue]="selectedValue"
            (selectionChange)="selectedValue = $event">
        </kit-dropdown>
    </section>

    <section class="showcase-section">
        <h3>Disabled</h3>
        <kit-dropdown
            [options]="options"
            placeholder="Disabled"
            [disabled]="true">
        </kit-dropdown>
    </section>
</div>
