<div class="showcase">
  <h1 class="showcase-title">Dropdown</h1>
  <p class="showcase-desc">Select component with customizable options.</p>

  <section class="showcase-section">
    <h3>Usage</h3>
    <div class="usage-block">
      <div class="usage-copy-wrap">
        <span *ngIf="copied" class="usage-copied-label">Copied!</span>
        <button type="button" class="usage-copy" [class.usage-copy--success]="copied" (buttonClicked)="copyUsageCode()" [title]="copied ? 'Copied!' : 'Copy code'">
          <svg *ngIf="copied" class="usage-copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <svg *ngIf="!copied" class="usage-copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <pre class="usage-example"><code>&lt;kit-dropdown
  [options]="options"
  placeholder="Choose one"
  [selectedValue]="selectedValue"
  (selectionChange)="onSelectionChange($event)"
&gt;&lt;/kit-dropdown&gt;</code></pre>
    </div>
  </section>

  <section class="showcase-section">
    <h3>Basic</h3>
    <kit-dropdown
      [options]="options"
      placeholder="Choose one"
      [selectedValue]="selectedValue"
      (selectionChange)="selectedValue = $event"
    ></kit-dropdown>
    <p *ngIf="selectedValue !== null" class="result">Selected: {{ selectedValue }}</p>
  </section>

  <section class="showcase-section">
    <h3>Disabled</h3>
    <kit-dropdown
      [options]="options"
      placeholder="Disabled"
      [disabled]="true"
    ></kit-dropdown>
  </section>
</div>
