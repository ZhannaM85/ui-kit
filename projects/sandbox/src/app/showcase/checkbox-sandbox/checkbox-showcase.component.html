<div class="showcase">
  <h1 class="showcase-title">Checkbox</h1>
  <p class="showcase-desc">Checkbox with label and states.</p>

  <section class="showcase-section">
    <h3>Usage</h3>
    <div class="usage-block">
      <div class="usage-copy-wrap">
        <span *ngIf="copied" class="usage-copied-label">Copied!</span>
        <button type="button" class="usage-copy" [class.usage-copy--success]="copied" (click)="copyUsageCode()" [title]="copied ? 'Copied!' : 'Copy code'">
          <svg *ngIf="copied" class="usage-copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <svg *ngIf="!copied" class="usage-copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <pre class="usage-example"><code>&lt;lib-checkbox
  label="Accept terms and conditions"
  [checked]="checked"
  [disabled]="false"
  [indeterminate]="false"
  (checkedChange)="onCheckedChange($event)"
&gt;&lt;/lib-checkbox&gt;</code></pre>
    </div>
  </section>

  <section class="showcase-section">
    <h3>Basic</h3>
    <lib-checkbox
      label="Accept terms and conditions"
      [checked]="checked"
      (checkedChange)="checked = $event"
    ></lib-checkbox>
    <p class="result">Checked: {{ checked }}</p>
  </section>

  <section class="showcase-section">
    <h3>Disabled</h3>
    <lib-checkbox label="Disabled unchecked" [disabled]="true"></lib-checkbox>
    <lib-checkbox label="Disabled checked" [checked]="true" [disabled]="true"></lib-checkbox>
  </section>

  <section class="showcase-section">
    <h3>Indeterminate</h3>
    <lib-checkbox label="Indeterminate state" [indeterminate]="true"></lib-checkbox>
  </section>
</div>
