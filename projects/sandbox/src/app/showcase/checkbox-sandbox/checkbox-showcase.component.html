<div class="showcase">
  <h1 class="showcase-title">Checkbox</h1>
  <p class="showcase-desc">Checkbox with label and states.</p>

  <section class="showcase-section">
    <h3>Usage</h3>
    <div class="usage-block">
      <div class="usage-copy-wrap">
        <span *ngIf="copied" class="usage-copied-label">Copied!</span>
        <button type="button" class="usage-copy" [class.usage-copy--success]="copied" (click)="copyUsageCode()" [title]="copied ? 'Copied!' : 'Copy code'">
          <kit-icon-check *ngIf="copied" class="usage-copy-icon" [size]="16"></kit-icon-check>
          <kit-icon-copy *ngIf="!copied" class="usage-copy-icon" [size]="16"></kit-icon-copy>
        </button>
      </div>
      <pre class="usage-example"><code>&lt;kit-checkbox
  label="Accept terms and conditions"
  [checked]="checked"
  [disabled]="false"
  [indeterminate]="false"
  (checkedChange)="onCheckedChange($event)"
&gt;&lt;/kit-checkbox&gt;</code></pre>
    </div>
  </section>

  <section class="showcase-section">
    <h3>Basic</h3>
    <kit-checkbox
      label="Accept terms and conditions"
      [checked]="checked"
      (checkedChange)="checked = $event"
    ></kit-checkbox>
    <p class="result">Checked: {{ checked }}</p>
  </section>

  <section class="showcase-section">
    <h3>Disabled</h3>
    <kit-checkbox label="Disabled unchecked" [disabled]="true"></kit-checkbox>
    <kit-checkbox label="Disabled checked" [checked]="true" [disabled]="true"></kit-checkbox>
  </section>

  <section class="showcase-section">
    <h3>Indeterminate</h3>
    <kit-checkbox label="Indeterminate state" [indeterminate]="true"></kit-checkbox>
  </section>
</div>
