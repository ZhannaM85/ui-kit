<div class="sidebar-header">
  <a routerLink="welcome" routerLinkActive="active" class="sidebar-home">UI Kit</a>
  <h2 class="sidebar-title">Components</h2>
  <input
    type="text"
    class="sidebar-filter"
    placeholder="Filter components..."
    [(ngModel)]="filter"
  />
</div>
<nav class="sidebar-nav">
  <a
    *ngFor="let item of filteredItems; trackBy: trackByPath"
    [routerLink]="item.path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: false }"
    class="sidebar-link"
  >
    {{ item.label }}
  </a>
  <p *ngIf="filteredItems.length === 0" class="sidebar-empty">No components match "{{ filter }}"</p>
</nav>
