<div class="lib-textarea-wrapper">
    <label *ngIf="label" class="lib-textarea-label">
        {{ label }}
        <span *ngIf="required" class="lib-textarea-required">*</span>
    </label>
    <textarea
        class="lib-textarea"
        [class.lib-textarea--error]="error"
        [class.lib-textarea--disabled]="disabled"
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="disabled"
        [required]="required"
        [rows]="rows"
        (input)="onInput($event)"
        (blur)="onBlur($event)"
    ></textarea>
    <span *ngIf="error" class="lib-textarea-error">{{ error }}</span>
    <span *ngIf="hint && !error" class="lib-textarea-hint">{{ hint }}</span>
</div>
