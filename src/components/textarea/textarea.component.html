<div class="lib-textarea-wrapper">
    <label *ngIf="label" [for]="textareaId" class="lib-textarea-label">
        {{ label }}
        <span *ngIf="required" class="lib-textarea-required">*</span>
    </label>
    <textarea
        [id]="textareaId"
        class="lib-textarea"
        [class.lib-textarea--error]="error"
        [class.lib-textarea--disabled]="disabled"
        [attr.aria-describedby]="describedById"
        [attr.aria-invalid]="error ? 'true' : null"
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="disabled"
        [required]="required"
        [rows]="rows"
        (input)="onInput($event)"
        (blur)="onBlur($event)"
    ></textarea>
    <span *ngIf="error" [id]="errorId" class="lib-textarea-error">{{ error }}</span>
    <span *ngIf="hint && !error" [id]="hintId" class="lib-textarea-hint">{{ hint }}</span>
</div>
